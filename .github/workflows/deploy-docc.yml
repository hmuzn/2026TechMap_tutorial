name: Deploy DocC to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: macos-15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build documentation
        run: >-
          xcodebuild docbuild
          -project SpatialObjectDrums.xcodeproj
          -scheme SpatialObjectDrums
          -destination 'generic/platform=visionOS'
          -derivedDataPath DerivedData
          DOCC_HOSTING_BASE_PATH=2026TechMap_tutorial
          CODE_SIGNING_ALLOWED=NO
      - name: Prepare Pages artifact
        run: |
          archive=$(find DerivedData -type d -name '*.doccarchive' -print -quit)
          test -n "$archive"
          mkdir -p site
          cp -R "$archive"/. site/
          test -f site/index.html
          test -f site/tutorials/spatialobjectdrums/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
